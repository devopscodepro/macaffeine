name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. The more details, the faster it gets fixed.
  - type: input
    id: app-version
    attributes:
      label: Macaffeine version
      description: Settings → General, at the bottom.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "macOS 15.3"
    validations:
      required: true
  - type: dropdown
    id: chip
    attributes:
      label: Mac
      options:
        - Apple silicon
        - Intel
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on Keep Awake for 1 hour
        2. Close the lid
        3. …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Optional, but very helpful. Run these in Terminal right after it happens and paste the output:
        `log show --last 10m --predicate 'subsystem == "pro.devopscode.Macaffeine"' --info`
        `pmset -g assertions`
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find the same problem.
          required: true
